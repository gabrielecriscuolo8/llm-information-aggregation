name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V1 tests
        run: python -m unittest discover -s experiments/v1_pilot/tests -v
      - name: Run V2 tests
        run: python -m unittest discover -s experiments/v2_confirmatory/tests -v

